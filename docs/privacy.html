<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PT Pro – Gizlilik Politikası</title>
    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      h1,
      h2,
      h3 {
        font-weight: 700;
      }
      a {
        color: #007aff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>PT Pro – Gizlilik Politikası</h1>
    <div id="content">İçerik yükleniyor...</div>

    <!-- Markdown'ı HTML'e çeviren ufak kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
      fetch(
        "https://raw.githubusercontent.com/hasanaytepe-a11y/pt-pro-legal/main/privacy_policy.md"
      )
        .then((r) => r.text())
        .then((text) => {
          document.getElementById("content").innerHTML = marked.parse(text);
        })
        .catch((err) => {
          document.getElementById("content").innerText =
            "İçerik yüklenirken bir hata oluştu.";
          console.error(err);
        });
    </script>
  </body>
</html>
